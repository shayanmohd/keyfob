<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Keyfob. One key, snapped cleanly into three shards that no longer line up.
       The key lies almost flat and runs the width of the tile, so at 48px it is a
       key first and a texture second: round bow with a hole, a long shaft, and two
       teeth that keep hanging down after the breaks. Graphite field, copper metal,
       a forge glow sitting in the gaps. -->
  <defs>
    <linearGradient id="graphite" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#495260"/>
      <stop offset="0.42" stop-color="#262C34"/>
      <stop offset="1" stop-color="#0B0E12"/>
    </linearGradient>
    <radialGradient id="forge" cx="0.5" cy="0.5" r="0.58">
      <stop offset="0" stop-color="#FFA469" stop-opacity="0.4"/>
      <stop offset="0.44" stop-color="#D4682C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C4652F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.44"/>
    </radialGradient>

    <linearGradient id="copper" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFDDB8"/>
      <stop offset="0.26" stop-color="#F49A5C"/>
      <stop offset="0.66" stop-color="#CA6229"/>
      <stop offset="1" stop-color="#8E3C12"/>
    </linearGradient>
    <linearGradient id="cutface" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#8C4419"/>
      <stop offset="1" stop-color="#381805"/>
    </linearGradient>
    <linearGradient id="brushed" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.24"/>
    </linearGradient>

    <!-- The key itself, in its own coordinates with the centre of the key at 0,0.
         Every shard is this one shape with a slice taken out of it, so the three
         pieces can only ever be pieces of the same key. -->
    <mask id="keymask" maskUnits="userSpaceOnUse" x="-60" y="-46" width="120" height="92">
      <rect x="-60" y="-46" width="120" height="92" fill="#000"/>
      <g fill="#fff">
        <circle cx="-22.5" cy="0" r="8.8"/>
        <rect x="-16" y="-3.4" width="47" height="6.8" rx="3.4"/>
        <rect x="18.6" y="-1" width="3.9" height="15" rx="1.35"/>
        <rect x="25.6" y="-1" width="3.9" height="12.2" rx="1.35"/>
      </g>
      <circle cx="-22.5" cy="0" r="3.6" fill="#000"/>
    </mask>

    <!-- the key minus the same key nudged down and right: a lit sliver along the
         top edge, and nothing along the broken faces -->
    <mask id="rimmask" maskUnits="userSpaceOnUse" x="-60" y="-46" width="120" height="92">
      <rect x="-60" y="-46" width="120" height="92" fill="#000"/>
      <g fill="#fff">
        <circle cx="-22.5" cy="0" r="8.8"/>
        <rect x="-16" y="-3.4" width="47" height="6.8" rx="3.4"/>
        <rect x="18.6" y="-1" width="3.9" height="15" rx="1.35"/>
        <rect x="25.6" y="-1" width="3.9" height="12.2" rx="1.35"/>
      </g>
      <circle cx="-22.5" cy="0" r="3.6" fill="#000"/>
      <g fill="#000" transform="translate(0.85 1.25)">
        <circle cx="-22.5" cy="0" r="8.8"/>
        <rect x="-16" y="-3.4" width="47" height="6.8" rx="3.4"/>
        <rect x="18.6" y="-1" width="3.9" height="15" rx="1.35"/>
        <rect x="25.6" y="-1" width="3.9" height="12.2" rx="1.35"/>
      </g>
    </mask>

    <!-- two breaks, both on the same slant, because one blow made them -->
    <clipPath id="slA" clipPathUnits="userSpaceOnUse">
      <polygon points="-60,-40 -14.5,-40 -8.1,40 -60,40"/>
    </clipPath>
    <clipPath id="slB" clipPathUnits="userSpaceOnUse">
      <polygon points="-9.9,-40 2.5,-40 8.9,40 -3.5,40"/>
    </clipPath>
    <clipPath id="slC" clipPathUnits="userSpaceOnUse">
      <polygon points="7.1,-40 60,-40 60,40 13.5,40"/>
    </clipPath>

    <filter id="drop" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.9"/>
      <feOffset dy="2.6" result="o"/>
      <feFlood flood-color="#05070A" flood-opacity="0.72"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="emberblur" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur stdDeviation="3.6"/>
    </filter>

    <!-- one shard, three times over: the cut face carrying the thickness of the
         metal, the copper face on top of it, then the lit edge over that -->
    <g id="shardA" clip-path="url(#slA)">
      <g mask="url(#keymask)" transform="translate(0.9 1.5)"><rect x="-60" y="-46" width="120" height="92" fill="url(#cutface)"/></g>
      <g mask="url(#keymask)">
        <rect x="-60" y="-46" width="120" height="92" fill="url(#copper)"/>
        <rect x="-60" y="-46" width="120" height="92" fill="url(#brushed)"/>
      </g>
      <g mask="url(#rimmask)"><rect x="-60" y="-46" width="120" height="92" fill="#FFE7CC" opacity="0.9"/></g>
    </g>
    <g id="shardB" clip-path="url(#slB)">
      <g mask="url(#keymask)" transform="translate(0.9 1.5)"><rect x="-60" y="-46" width="120" height="92" fill="url(#cutface)"/></g>
      <g mask="url(#keymask)">
        <rect x="-60" y="-46" width="120" height="92" fill="url(#copper)"/>
        <rect x="-60" y="-46" width="120" height="92" fill="url(#brushed)"/>
      </g>
      <g mask="url(#rimmask)"><rect x="-60" y="-46" width="120" height="92" fill="#FFE7CC" opacity="0.9"/></g>
    </g>
    <g id="shardC" clip-path="url(#slC)">
      <g mask="url(#keymask)" transform="translate(0.9 1.5)"><rect x="-60" y="-46" width="120" height="92" fill="url(#cutface)"/></g>
      <g mask="url(#keymask)">
        <rect x="-60" y="-46" width="120" height="92" fill="url(#copper)"/>
        <rect x="-60" y="-46" width="120" height="92" fill="url(#brushed)"/>
      </g>
      <g mask="url(#rimmask)"><rect x="-60" y="-46" width="120" height="92" fill="#FFE7CC" opacity="0.9"/></g>
    </g>

    <!-- where the three pieces sit: A holds still, B and C have moved -->
    <g id="broken">
      <use href="#shardA"/>
      <g transform="translate(0.4 2.4) rotate(2.2 0 0)"><use href="#shardB"/></g>
      <g transform="translate(1.4 -2.4) rotate(-2.2 21 0)"><use href="#shardC"/></g>
    </g>
  </defs>

  <g id="bg">
    <rect width="108" height="108" fill="url(#graphite)"/>
    <rect width="108" height="108" fill="url(#forge)"/>
    <!-- brushed graphite, faint, so the field is a surface and not a flat panel -->
    <g opacity="0.05" stroke="#FFFFFF" stroke-width="0.8">
      <path d="M-8 20 L116 -12"/><path d="M-8 44 L116 12"/><path d="M-8 68 L116 36"/>
      <path d="M-8 92 L116 60"/><path d="M-8 116 L116 84"/>
    </g>
    <rect width="108" height="108" fill="url(#vign)"/>
    <!-- chips thrown off along the line the metal gave way on -->
    <g fill="#FFC08C">
      <circle cx="48" cy="27" r="1.3" opacity="0.8"/>
      <circle cx="41" cy="20" r="0.7" opacity="0.46"/>
      <circle cx="74" cy="83" r="1.15" opacity="0.7"/>
      <circle cx="81" cy="90" r="0.62" opacity="0.4"/>
      <circle cx="26" cy="86" r="0.55" opacity="0.32"/>
      <circle cx="86" cy="22" r="0.5" opacity="0.3"/>
    </g>
  </g>

  <g id="fg">
    <!-- the forge sitting in the two gaps, so a break glows rather than goes dead -->
    <g opacity="0.5" filter="url(#emberblur)">
      <ellipse cx="45.7" cy="54.7" rx="5.2" ry="8.8" fill="#F0812F"/>
      <ellipse cx="61.3" cy="53.4" rx="5.2" ry="8.8" fill="#F0812F"/>
    </g>
    <g filter="url(#drop)">
      <g transform="translate(54 54) rotate(-5) scale(0.92)"><use href="#broken"/></g>
    </g>
  </g>

  <g id="mono">
    <g transform="translate(54 54) rotate(-5) scale(0.92)" fill="#000">
      <g clip-path="url(#slA)"><g mask="url(#keymask)"><rect x="-60" y="-46" width="120" height="92" fill="#000"/></g></g>
      <g transform="translate(0.4 2.4) rotate(2.2 0 0)"><g clip-path="url(#slB)"><g mask="url(#keymask)"><rect x="-60" y="-46" width="120" height="92" fill="#000"/></g></g></g>
      <g transform="translate(1.4 -2.4) rotate(-2.2 21 0)"><g clip-path="url(#slC)"><g mask="url(#keymask)"><rect x="-60" y="-46" width="120" height="92" fill="#000"/></g></g></g>
    </g>
  </g>
</svg>
